<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CreditSense AI — Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg, #1A3557 0%, #2563EB 100%); min-height: 100vh; }
    .auth-card { border-radius: 16px; border: none; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .brand-logo { font-size: 1.8rem; font-weight: 700; color: #2563EB; letter-spacing: -0.5px; }
    .brand-sub  { font-size: 0.8rem; color: #6B7280; letter-spacing: 2px; text-transform: uppercase; }
    .btn-primary { background: #2563EB; border: none; padding: 10px; font-weight: 500; border-radius: 8px; }
    .btn-primary:hover { background: #1d4ed8; }
    .form-control { border-radius: 8px; border: 1px solid #E5E7EB; padding: 10px 14px; }
    .form-control:focus { border-color: #2563EB; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
    .tab-pill { cursor: pointer; padding: 8px 24px; border-radius: 20px; font-weight: 500;
                font-size: 0.9rem; color: #6B7280; transition: all .2s; }
    .tab-pill.active { background: #2563EB; color: white; }
    .alert { border-radius: 8px; font-size: 0.9rem; }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center">
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">

      <div class="auth-card card p-4">
        <div class="text-center mb-4">
          <div class="brand-logo"><i class="bi bi-shield-check me-2"></i>CreditSense</div>
          <div class="brand-sub">AI Credit Platform</div>
        </div>

        <div class="d-flex justify-content-center gap-2 mb-4">
          <div class="tab-pill active" id="tab-login" onclick="switchTab('login')">Login</div>
          <div class="tab-pill" id="tab-register" onclick="switchTab('register')">Register</div>
        </div>

        <div id="alert" class="alert d-none" role="alert"></div>

        <div id="form-login">
          <div class="mb-3">
            <label class="form-label small">Email Address</label>
            <input type="email" id="login-email" class="form-control"
                   placeholder="you@example.com">
          </div>
          <div class="mb-4">
            <label class="form-label small">Password</label>
            <input type="password" id="login-password" class="form-control"
                   placeholder="••••••••">
          </div>
          <button class="btn btn-primary w-100" onclick="doLogin()">
            <span id="login-spinner" class="spinner-border spinner-border-sm me-2 d-none"></span>
            Sign In
          </button>
          <p class="text-center mt-3 small text-muted">
            Officer/Admin accounts are provisioned by your system administrator.
          </p>
        </div>

        <div id="form-register" class="d-none">
          <div class="mb-3">
            <label class="form-label small">Full Name</label>
            <input type="text" id="reg-name" class="form-control" placeholder="Rahul Sharma">
          </div>
          <div class="mb-3">
            <label class="form-label small">Email Address</label>
            <input type="email" id="reg-email" class="form-control"
                   placeholder="you@example.com">
          </div>
          <div class="mb-4">
            <label class="form-label small">Password</label>
            <input type="password" id="reg-password" class="form-control"
                   placeholder="Minimum 8 characters">
            <div class="form-text">Must include uppercase, lowercase, and a number.</div>
          </div>
          <button class="btn btn-primary w-100" onclick="doRegister()">
            <span id="reg-spinner" class="spinner-border spinner-border-sm me-2 d-none"></span>
            Create Account
          </button>
        </div>

      </div>

      <p class="text-center mt-3 text-white-50 small">
        &copy; 2024 CreditSense AI — Intelligent Credit Risk Platform
      </p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/api.js"></script>
<script>
  if (AUTH.isLoggedIn()) AUTH.redirectByRole();

  function switchTab(tab) {
    document.getElementById('form-login').classList.toggle('d-none', tab !== 'login');
    document.getElementById('form-register').classList.toggle('d-none', tab !== 'register');
    document.getElementById('tab-login').classList.toggle('active', tab === 'login');
    document.getElementById('tab-register').classList.toggle('active', tab === 'register');
    hideAlert();
  }

  function showAlert(msg, type = 'danger') {
    const el = document.getElementById('alert');
    el.className = `alert alert-${type}`;
    el.textContent = msg;
    el.classList.remove('d-none');
  }

  function hideAlert() {
    document.getElementById('alert').classList.add('d-none');
  }

  function validatePassword(password) {
    const issues = [];
    if (password.length < 8)     issues.push("at least 8 characters");
    if (!/[A-Z]/.test(password)) issues.push("one uppercase letter");
    if (!/[a-z]/.test(password)) issues.push("one lowercase letter");
    if (!/[0-9]/.test(password)) issues.push("one number");
    return issues;
  }

  async function doLogin() {
    const email    = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;

    if (!email || !password) { showAlert('Please enter email and password.'); return; }

    const spinner = document.getElementById('login-spinner');
    spinner.classList.remove('d-none');

    try {
      const res = await API.auth.login(email, password);
      showAlert('Login successful! Redirecting...', 'success');
      setTimeout(() => {
        AUTH.save(res.data);
        AUTH.redirectByRole();
      }, 600);
    } catch (err) {
      const msg = err.response?.data?.message || 'Login failed. Check your credentials.';
      showAlert(msg);
    } finally {
      spinner.classList.add('d-none');
    }
  }

  async function doRegister() {
    const name     = document.getElementById('reg-name').value.trim();
    const email    = document.getElementById('reg-email').value.trim();
    const password = document.getElementById('reg-password').value;

    if (!name || !email || !password) { showAlert('All fields are required.'); return; }

    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailPattern.test(email)) { showAlert('Please enter a valid email address.'); return; }

    const passwordIssues = validatePassword(password);
    if (passwordIssues.length > 0) {
      showAlert(`Password must contain ${passwordIssues.join(', ')}.`);
      return;
    }

    const spinner = document.getElementById('reg-spinner');
    spinner.classList.remove('d-none');

    try {
      const res = await API.auth.register(name, email, password);
      showAlert('Account created successfully! Signing you in...', 'success');
      setTimeout(() => {
        AUTH.save(res.data);
        AUTH.redirectByRole();
      }, 1200);
    } catch (err) {
      const msg = err.response?.data?.message || 'Registration failed.';
      showAlert(msg);
    } finally {
      spinner.classList.add('d-none');
    }
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const isLogin = !document.getElementById('form-login').classList.contains('d-none');
      isLogin ? doLogin() : doRegister();
    }
  });
</script>
</body>
</html>
